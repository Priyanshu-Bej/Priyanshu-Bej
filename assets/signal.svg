<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="1200" height="130" role="img" aria-label="4.5+ years production experience, 15+ apps shipped, crores in revenue impact" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .mono{font-family:"SFMono-Regular",Consolas,Menlo,monospace}
      .sans{font-family:"Helvetica Neue",Inter,Arial,sans-serif}
      .card{opacity:0;animation:rise .7s ease forwards}
      .c1{animation-delay:.1s}.c2{animation-delay:.3s}.c3{animation-delay:.5s}.c4{animation-delay:.7s}
      @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    </style>
  </defs>
  <rect width="1200" height="130" rx="12" fill="#0A0C0C"/>

  <g class="card c1">
    <rect x="8" y="14" width="284" height="102" rx="10" fill="#0F1413" stroke="#1f2b29"/>
    <text class="sans" x="32" y="62" fill="#F5F2EA" font-size="30" font-weight="700">4.5+ yrs</text>
    <text class="mono" x="32" y="88" fill="#9BA3A3" font-size="11" letter-spacing="1.5">PRODUCTION EXPERIENCE</text>
    <rect x="8" y="14" width="3" height="102" fill="#2DD4BF"/>
  </g>
  <g class="card c2">
    <rect x="304" y="14" width="284" height="102" rx="10" fill="#0F1413" stroke="#1f2b29"/>
    <text class="sans" x="328" y="62" fill="#F5F2EA" font-size="30" font-weight="700">15+ apps</text>
    <text class="mono" x="328" y="88" fill="#9BA3A3" font-size="11" letter-spacing="1.5">SHIPPED ACROSS STORES</text>
    <rect x="304" y="14" width="3" height="102" fill="#2DD4BF"/>
  </g>
  <g class="card c3">
    <rect x="600" y="14" width="284" height="102" rx="10" fill="#0F1413" stroke="#1f2b29"/>
    <text class="sans" x="624" y="62" fill="#F5F2EA" font-size="30" font-weight="700">Crores</text>
    <text class="mono" x="624" y="88" fill="#9BA3A3" font-size="11" letter-spacing="1.5">REVENUE IMPACT</text>
    <rect x="600" y="14" width="3" height="102" fill="#2DD4BF"/>
  </g>
  <g class="card c4">
    <rect x="896" y="14" width="296" height="102" rx="10" fill="#0F1413" stroke="#1f2b29"/>
    <text class="sans" x="920" y="62" fill="#F5F2EA" font-size="30" font-weight="700">IIT KGP</text>
    <text class="mono" x="920" y="88" fill="#9BA3A3" font-size="11" letter-spacing="1.5">STUDYING GENERATIVE AI</text>
    <rect x="896" y="14" width="3" height="102" fill="#2DD4BF"/>
    <circle cx="1168" cy="34" r="4" fill="#2DD4BF">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
