<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Priyanshu Bej, Senior Mobile Developer. Products engineered for performance, reliability, and scale." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d2b28"/>
      <stop offset="55%" stop-color="#0A0C0C"/>
      <stop offset="100%" stop-color="#0A0C0C"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2DD4BF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1b2422" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="340" rx="14"/></clipPath>
    <style>
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;}
      .sans{font-family:"Helvetica Neue",Inter,Arial,sans-serif;}
      .fade{opacity:0;animation:fadeUp .9s ease forwards;}
      .d1{animation-delay:.15s}.d2{animation-delay:.35s}.d3{animation-delay:.55s}
      .d4{animation-delay:.75s}.d5{animation-delay:.95s}.d6{animation-delay:1.15s}
      @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      .caret{animation:blink 1.05s steps(1) infinite}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#glow)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect x="-400" y="0" width="400" height="340" fill="url(#sweep)" opacity="0.5">
      <animate attributeName="x" from="-400" to="1200" dur="5.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="1200" height="2" fill="#2DD4BF" opacity="0.8"/>

    <g class="fade d1">
      <text class="mono" x="56" y="66" fill="#2DD4BF" font-size="13" letter-spacing="3">SENIOR MOBILE DEVELOPER @ IRISS INC.</text>
      <line x1="470" y1="61" x2="600" y2="61" stroke="#2DD4BF" stroke-opacity="0.4" stroke-width="1"/>
    </g>

    <g class="sans" fill="#F5F2EA" font-weight="700" font-size="74" letter-spacing="-2.5">
      <text class="fade d2" x="52" y="150">Products engineered</text>
      <text class="fade d3" x="52" y="228">for performance<tspan fill="#2DD4BF">,</tspan></text>
      <text class="fade d4" x="52" y="306">reliability<tspan fill="#2DD4BF">,</tspan> and scale<tspan fill="#2DD4BF">.</tspan></text>
    </g>

    <g class="fade d5">
      <rect x="880" y="40" width="270" height="118" rx="10" fill="#0F1413" stroke="#1f2b29"/>
      <text class="mono" x="900" y="68" fill="#2DD4BF" font-size="11" letter-spacing="2.5">CURRENT SIGNAL</text>
      <text class="sans" x="900" y="96" fill="#F5F2EA" font-size="15" font-weight="600">Mobile, industrial IoT and AI</text>
      <text class="sans" x="900" y="120" fill="#9BA3A3" font-size="13">Bengaluru, India</text>
      <text class="sans" x="900" y="142" fill="#9BA3A3" font-size="13">Over 4 years, 15+ apps shipped</text>
      <circle cx="1130" cy="62" r="4" fill="#2DD4BF">
        <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g class="fade d6">
      <text class="mono" x="884" y="206" fill="#9BA3A3" font-size="13">~/ building</text>
      <text class="mono" x="884" y="206" fill="#F5F2EA" font-size="13">
        <tspan x="884" dy="26">production systems</tspan>
      </text>
      <rect class="caret" x="1010" y="220" width="8" height="14" fill="#2DD4BF"/>
    </g>

    <rect x="0" y="338" width="1200" height="2" fill="#141b1a"/>
  </g>
</svg>
