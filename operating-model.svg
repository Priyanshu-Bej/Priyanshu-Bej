<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-label="Operating model: Discover, Architect, Build, Release" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="g2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#161d1c" stroke-width="1"/>
    </pattern>
    <style>
      .mono{font-family:"SFMono-Regular",Consolas,Menlo,monospace}
      .sans{font-family:"Helvetica Neue",Inter,Arial,sans-serif}
      .node{opacity:0;animation:pop .6s ease forwards}
      .n1{animation-delay:.1s}.n2{animation-delay:.5s}.n3{animation-delay:.9s}.n4{animation-delay:1.3s}
      @keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    </style>
  </defs>

  <rect width="1200" height="170" rx="12" fill="#0A0C0C"/>
  <rect width="1200" height="170" rx="12" fill="url(#g2)"/>
  <rect x="0" y="0" width="1200" height="1" fill="#1f2b29"/>

  <text class="mono" x="40" y="36" fill="#2DD4BF" font-size="11" letter-spacing="3">OPERATING MODEL</text>

  <line x1="120" y1="104" x2="1080" y2="104" stroke="#1f2b29" stroke-width="2"/>
  <line x1="120" y1="104" x2="1080" y2="104" stroke="#2DD4BF" stroke-width="2" stroke-dasharray="90 870" opacity="0.9">
    <animate attributeName="stroke-dashoffset" from="960" to="0" dur="4s" repeatCount="indefinite"/>
  </line>

  <g class="node n1">
    <circle cx="120" cy="104" r="9" fill="#0A0C0C" stroke="#2DD4BF" stroke-width="2"/>
    <circle cx="120" cy="104" r="3.5" fill="#2DD4BF"/>
    <text class="sans" x="120" y="82" fill="#F5F2EA" font-size="18" font-weight="700" text-anchor="middle">Discover</text>
    <text class="mono" x="120" y="134" fill="#9BA3A3" font-size="11" text-anchor="middle">01  understand the problem</text>
  </g>
  <g class="node n2">
    <circle cx="440" cy="104" r="9" fill="#0A0C0C" stroke="#2DD4BF" stroke-width="2"/>
    <circle cx="440" cy="104" r="3.5" fill="#2DD4BF"/>
    <text class="sans" x="440" y="82" fill="#F5F2EA" font-size="18" font-weight="700" text-anchor="middle">Architect</text>
    <text class="mono" x="440" y="134" fill="#9BA3A3" font-size="11" text-anchor="middle">02  design it to last</text>
  </g>
  <g class="node n3">
    <circle cx="760" cy="104" r="9" fill="#0A0C0C" stroke="#2DD4BF" stroke-width="2"/>
    <circle cx="760" cy="104" r="3.5" fill="#2DD4BF"/>
    <text class="sans" x="760" y="82" fill="#F5F2EA" font-size="18" font-weight="700" text-anchor="middle">Build</text>
    <text class="mono" x="760" y="134" fill="#9BA3A3" font-size="11" text-anchor="middle">03  build it properly</text>
  </g>
  <g class="node n4">
    <circle cx="1080" cy="104" r="9" fill="#0A0C0C" stroke="#2DD4BF" stroke-width="2"/>
    <circle cx="1080" cy="104" r="3.5" fill="#2DD4BF"/>
    <text class="sans" x="1080" y="82" fill="#F5F2EA" font-size="18" font-weight="700" text-anchor="middle">Release</text>
    <text class="mono" x="1080" y="134" fill="#9BA3A3" font-size="11" text-anchor="middle">04  ship it to real users</text>
  </g>
</svg>
